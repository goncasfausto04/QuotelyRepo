# Keeps the free-tier infrastructure awake:
#  - Render free web services sleep after 15 min without traffic (30-60s cold start)
#  - Supabase free projects pause after ~7 days without activity
# Hitting /health/db wakes the server AND runs a tiny DB query.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#        add BACKEND_URL = https://<your-service>.onrender.com
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay runs a few minutes; that's fine
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend + database
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL repository variable is not set, skipping"
            exit 0
          fi
          # Retry: the first request after a sleep can take ~60s
          for i in 1 2 3 4; do
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 90 "${BACKEND_URL%/}/health/db" || echo 000)
            echo "attempt $i -> HTTP $code: $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::Backend or database did not respond healthy"
          exit 1
